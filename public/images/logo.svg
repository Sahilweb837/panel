<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect width="200" height="200" fill="#ff5532" rx="20"/>
  
  <!-- Gradient -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff5532;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d63a1f;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#grad1)" rx="20"/>
  
  <!-- Building/Institute Symbol -->
  <g transform="translate(100, 100)">
    <!-- Building base -->
    <rect x="-35" y="-20" width="70" height="60" fill="white" opacity="0.95" rx="4"/>
    
    <!-- Roof/Peak -->
    <polygon points="0,-40 -45,-20 45,-20" fill="white" opacity="0.95"/>
    
    <!-- Door -->
    <rect x="-10" y="20" width="20" height="30" fill="#ff5532" opacity="0.8"/>
    <circle cx="-2" cy="35" r="2" fill="white"/>
    
    <!-- Windows - Left column -->
    <rect x="-30" y="-10" width="12" height="12" fill="#3b82f6" opacity="0.8"/>
    <rect x="-30" y="10" width="12" height="12" fill="#3b82f6" opacity="0.8"/>
    
    <!-- Windows - Right column -->
    <rect x="18" y="-10" width="12" height="12" fill="#3b82f6" opacity="0.8"/>
    <rect x="18" y="10" width="12" height="12" fill="#3b82f6" opacity="0.8"/>
    
    <!-- Flag on top -->
    <line x1="0" y1="-42" x2="0" y2="-55" stroke="white" stroke-width="2"/>
    <rect x="0" y="-55" width="20" height="10" fill="white" opacity="0.9"/>
  </g>
  
  <!-- Text -->
  <text x="100" y="170" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">NETCODER</text>
</svg>
